<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Community Lens</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><strong>Community Lens</strong><span id="badge" class="badge" title="La app solo escucha en esta máquina">local</span></div>
  <div class="scope">
    <label>Grupo <select id="chat"></select></label>
    <label>Desde <input type="date" id="from"></label>
    <label>Hasta <input type="date" id="to"></label>
    <button id="allTime" class="ghost" type="button">Todo el historial</button>
  </div>
  <nav id="tabs" class="tabs" aria-label="Secciones">
    <a href="#/resumen" data-tab="resumen">Resumen</a>
    <a href="#/explorar" data-tab="explorar">Explorar</a>
    <a href="#/recursos" data-tab="recursos">Recursos</a>
    <a href="#/categorias" data-tab="categorias">Categorías</a>
    <a href="#/importar" data-tab="importar">Importar</a>
    <a href="#/reporte" data-tab="reporte">Reporte</a>
    <a href="/como-funciona" target="_blank" rel="noopener">Cómo funciona ↗</a>
  </nav>
</header>
<main id="view" tabindex="-1"></main>
<aside id="drawer" class="drawer" hidden aria-label="Contexto del mensaje"></aside>
<div id="toast" class="toast" role="status" hidden></div>
<script src="vendor/d3.min.js"></script>
<script src="vendor/plot.umd.min.js"></script>
<script type="module" src="dist/app.js"></script>
</body>
</html>
